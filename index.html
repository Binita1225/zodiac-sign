<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Zodiac Insight — Minimal Horoscope Experience</title>
    <meta
      name="description"
      content="A minimal, premium horoscope experience. Daily insights, compatibility, lucky numbers and more across all 12 zodiac signs."
    />
    <meta name="author" content="Zodiac Insight" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#16131f" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Apply saved theme before first paint; dark is the default (matches the portfolio). Its CSP hash is computed at build time in vite.config.ts. -->
    <script>(function(){try{var t=localStorage.getItem("zi-theme");if(t!=="light")document.documentElement.classList.add("dark")}catch(e){}})()</script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <meta property="og:title" content="Zodiac Insight — Minimal Horoscope Experience" />
    <meta
      property="og:description"
      content="Daily horoscopes, compatibility and cosmic guidance — designed minimally."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <noscript>Zodiac Insight needs JavaScript enabled.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
